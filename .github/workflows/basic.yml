name: Basic Checks

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting and line length with ruff
        run: uv run ruff format --check .

      - name: Check type hints with ty
        run: uv run ty check

      - name: Run tests with pytest
        run: uv run pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=src tests/ | tee pytest-coverage.txt

  # The DeepEval suite (evals/) hits a live Qdrant index and makes real Gemini
  # calls, so it isn't run on every commit here. Trigger it manually via the
  # "DeepEval Suite (manual)" workflow, or locally: pytest evals/test_agent.py -v
