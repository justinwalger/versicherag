[project]
name = "versicherag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
api = [
    "fastapi>=0.140.0",
    "fastapi-cli>=0.0.32",
    "google-genai>=2.14.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.1",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.51.0",
]
data = [
    "bs4>=0.0.2",
    "docling>=2.115.0",
    "google-genai>=2.14.0",
    "ipykernel>=7.3.0",
    "langchain-core>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "setuptools>=83.0.0",
    "zenml[local]>=0.96.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]
eval = [
    "deepeval>=4.1.4",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.59.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "tool_call: agent must call the search tool",
    "no_tool_call: agent must not call any tool",
    "correctness: answer must state the retrieved fact accurately",
    "citation: answer must include a concrete source citation",
    "tone: answer must maintain an appropriate tone",
    "out_of_scope: agent must decline instead of fabricating",
]


[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4


[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
